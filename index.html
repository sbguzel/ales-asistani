<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ALES Asistanı | Akıllı Soru Bankası & Zen Çalışma Platformu</title>
  <meta name="description" content="Sıfır ses, Apple sadeliğinde kullanıcı girişi, entegre dijital karalama alanı ve KaTeX destekli ALES çalışma platformu." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Modern Fontlar (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/ui/theme/main.css" />
  <link rel="stylesheet" href="/src/ui/theme/components.css" />
</head>
<body>
  <div id="app">
    <!-- Üst Başlık Çubuğu (Header) -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand" id="brand-home" title="ALES Asistanı Ana Sayfa">
          <div class="brand-icon">A</div>
          <span class="brand-title">ALES Asistanı</span>
          <span class="brand-badge">Zen Mod</span>
          <span class="db-status-badge loading" id="db-status-badge" title="Veritabanı Durumu">
            <span class="db-status-dot"></span>
            <span class="db-status-text">Bağlanıyor...</span>
          </span>
        </div>

        <nav class="mode-selector" aria-label="Ders Seçimi">
          <button class="mode-btn active" data-mode="all">Tümü</button>
          <button class="mode-btn" data-mode="matematik">Matematik</button>
          <button class="mode-btn" data-mode="mantik">Mantık</button>
          <button class="mode-btn" data-mode="turkce">Türkçe</button>
          <button class="mode-btn" data-mode="mistakes" title="Yanlış Yapılan Sorular">Hata Defteri</button>
          <button class="mode-btn" data-mode="analytics" title="Detaylı Soru ve Süre Analizi">📊 Analiz</button>
        </nav>
      </div>

      <div class="header-center">
        <div class="zen-timer" id="zen-timer" title="Soru Çözüm Süresi (Sessiz Sayaç)">
          <span class="timer-dot"></span>
          <span class="timer-text">00:00</span>
        </div>
        <div class="question-nav-group">
          <button class="nav-arrow-btn" id="prev-question-btn" title="Önceki Soru (←)">‹</button>
          <span class="question-counter" id="question-counter">Soru 1 / 18</span>
          <button class="nav-arrow-btn" id="next-nav-btn" title="Sonraki Soru (→)">›</button>
        </div>
      </div>

      <div class="header-right">
        <!-- Tema Değiştirici -->
        <button class="btn-icon" id="theme-toggle-btn" title="Tema Değiştir (Koyu / Açık)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- Kullanıcı Giriş Butonu / Profil Rozeti -->
        <div id="auth-header-container">
          <button class="user-profile-badge" id="open-auth-btn">
            <span class="user-avatar-circle">?</span>
            <span>Giriş Yap</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Ana Çalışma Alanı (Workspace) -->
    <main class="workspace">
      <!-- Sol Panel: Soru ve Şıklar -->
      <section class="question-panel" id="question-panel" aria-label="Soru İçeriği">
        <div id="question-container">
          <!-- Soru QuizRenderer tarafından dinamik doldurulur -->
        </div>
      </section>

      <!-- Analiz ve Süre Dashboard Paneli -->
      <section class="analytics-panel" id="analytics-panel" style="display: none;" aria-label="Performans ve Süre Analizi">
        <!-- AnalyticsManager tarafından dinamik doldurulur -->
      </section>

      <!-- Sağ Panel: Karalama & Çizim Alanı (Canvas) -->
      <section class="canvas-panel" id="canvas-panel" aria-label="Karalama Tahtası">
        <div class="canvas-toolbar" id="canvas-toolbar">
          <button class="tool-btn mobile-back-btn" id="close-canvas-mobile-btn" title="Soruya Dön">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Soru</span>
          </button>
          <div class="toolbar-divider mobile-back-divider"></div>

          <button class="tool-btn active" id="tool-pen" title="Kalem (Çizim)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
          </button>
          
          <button class="tool-btn" id="tool-eraser" title="Silgi">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L21 6C22 7 22 9 21 10L14 17"></path></svg>
          </button>

          <div class="toolbar-divider"></div>

          <!-- Renk Seçenekleri -->
          <span class="color-dot active" data-color="#38bdf8" style="background: #38bdf8;" title="Mavi"></span>
          <span class="color-dot" data-color="#10b981" style="background: #10b981;" title="Yeşil"></span>
          <span class="color-dot" data-color="#f43f5e" style="background: #f43f5e;" title="Kırmızı/Gül"></span>
          <span class="color-dot" data-color="#fbbf24" style="background: #fbbf24;" title="Sarı"></span>
          <span class="color-dot" data-color="#f8fafc" style="background: #f8fafc;" title="Beyaz"></span>

          <div class="toolbar-divider"></div>

          <button class="tool-btn" id="tool-grid" title="Tablo Izgarası (Grid)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
          </button>

          <button class="tool-btn" id="tool-undo" title="Geri Al (Undo)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path></svg>
          </button>

          <button class="tool-btn" id="tool-redo" title="İleri Al (Redo)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"></path></svg>
          </button>

          <button class="tool-btn" id="tool-clear" title="Tahtayı Temizle">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
          </button>
        </div>

        <canvas id="drawing-canvas"></canvas>
      </section>
    </main>

    <!-- Mobil Çizim / Soru Geçiş Butonu -->
    <button class="mobile-view-toggle" id="mobile-view-toggle">
      <span>✏️ Karalama Tahtası</span>
    </button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
